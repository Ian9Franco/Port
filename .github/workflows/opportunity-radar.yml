name: Opportunity Radar

on:
  schedule:
    - cron: "23 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opportunity-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check
        run: |
          node --check scripts/load-career-model.mjs
          node --check scripts/fetch-opportunities.mjs

      - name: Fetch and rank opportunities
        run: node scripts/fetch-opportunities.mjs

      - name: Commit updated radar data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json reports/latest.md reports/all-candidates.md reports/application-prep.md
          if git diff --cached --quiet; then
            echo "No opportunity changes."
            exit 0
          fi
          git commit -m "chore(radar): refresh opportunities"
          git push
